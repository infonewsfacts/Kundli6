# GitHub पर इस फाइल का पाथ होना चाहिए: .github/workflows/build-apk.yml
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 tz-lookup@6
          cp node_modules/tz-lookup/tz.js www/tz.js
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.vedickundli.app",
            "appName": "Vedic Kundli",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VedicKundli-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
